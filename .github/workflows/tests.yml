name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install 'torch>=2.8,<3' 'torchvision>=0.23,<1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Check syntax
        run: python -m compileall -q linyphiidae_id main.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          LINYPHIIDAE_GUI_TESTS: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p test_gui.py -v
      - name: GUI smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          LINYPHIIDAE_GUI_TESTS: '1'
        run: python -m unittest discover -s tests -p test_gui.py -v
